# Compresión y caché para orvae.pe
# Incluir dentro del bloque `server { ... }` del sitio:
#     include /etc/nginx/snippets/orvae-performance.conf;
# Luego: sudo nginx -t && sudo systemctl reload nginx

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;

# Assets de Vite: el nombre lleva hash, se pueden cachear para siempre.
location ^~ /build/assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
    try_files $uri =404;
}
